image: docker:latest

before_script:
  - docker info

services:
  - docker:18.09.1-dind
  

build:
  stage: build
  only:
    - Event
  script:
    - docker build -t productimage:latest inventoryservice/.
    - docker tag productimage:latest 127.0.0.1:5000:5000/productimage:latest
    - docker push 127.0.0.1:5000:5000/productimage:latest

