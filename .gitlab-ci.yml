image: docker:latest

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

services:
  - docker:18.09.1-dind

build:
  stage: build
  only:
    - master
  script:
    - docker build -t frontend:latest frontend/.
    - docker tag frontend:latest meshudn/frontend:latest
    - docker push meshudn/frontend:latest
