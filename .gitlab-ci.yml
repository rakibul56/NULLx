image: docker:latest

before_script:
  - docker info
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

services:
  - docker:18.09.1-dind
  

build:
  stage: build
  only:
    - Event
  script:
    - docker build -t productimage:latest inventoryservice/.
    - docker tag productimage:latest 134.109.233.159:5000/productimage:latest
    - docker push 134.109.233.159:5000/productimage

