image: docker:latest

before_script:
  - docker info

services:
  - docker:18.09.1-dind

build:
  stage: build
  only:
    - master
  script:
    - docker pull nginx
    - docker tag docker.io/nginx vsr-kub005.vsr-kub005.informatik.tu-chemnitz.de:t:5000/mynginx
