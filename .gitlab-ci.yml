image: docker:latest

before_script:
  - docker info
  - docker login -u 'meshudn' -p 'vortex1!@' 'docker-registry:5000'  

services:
  - docker:18.09.1-dind

build:
  stage: build
  only:
    - master
  script:
    - docker build -t productservice inventoryservice/.
    - docker tag productservice docker-registry:5000/productservice
    - docker push docker-registry:5000/productservice
