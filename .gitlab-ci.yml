image: docker:latest

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

services:
  - docker:18.09.1-dind

build:
  stage: build
  only:
    - master
  script:
    - docker build -t productimage:latest inventoryservice/.
    - docker tag productimage:latest meshudn/productimage:latest
    - docker push meshudn/productimage:latest
