image: docker:latest

before_script:
  - docker info
  - docker login -u gitlab-ci-token -p "$CI_BUILD_TOKEN" "$CI_REGISTRY"

services:
  - docker:18.09.1-dind

build:
  stage: build
  only:
    - master
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:latest" inventoryservice/.
    - docker push "$CI_REGISTRY_IMAGE:latest"

