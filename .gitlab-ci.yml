image: docker:latest

before_script:
  - docker info  

services:
  - docker:18.09.1-dind

build:
  stage: build
  only:
    - master
  script:
    - docker build -t meshudn/inventoryservice inventoryservice/.
    - docker tag meshudn/inventoryservice docker-registry:5000/inventoryservice
    - docker push docker-registry:5000/inventoryservice
    
